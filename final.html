<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Expression Challenge — Results</title>
<link rel="stylesheet" href="final.css">
</head>
<body>

  <div class="bg-layer"></div>
  <div class="bg-scrim"></div>

  <main class="result-wrap">
    <div class="badge">🏆 Challenge Complete</div>
    <h1 class="headline">You nailed it!</h1>
    <p class="subline">You matched at least half your expressions with real accuracy.</p>

    <div class="stat-card">
      <div class="stat-primary">
        <div id="scoreValue" class="stat-primary-value">0 / 0</div>
        <div class="stat-primary-label">Final Score</div>
      </div>
      <div class="stat-row">
        <div class="stat-block">
          <div id="accuracyValue" class="stat-block-value">0%</div>
          <div class="stat-block-label">Avg Accuracy</div>
        </div>
        <div class="stat-block">
          <div id="roundsValue" class="stat-block-value">0 / 0</div>
          <div class="stat-block-label">Rounds Done</div>
        </div>
      </div>
    </div>

    <a href="home.html" class="again-btn">Play Again</a>
  </main>

  <script src="final.js"></script>
</body>
</html>
